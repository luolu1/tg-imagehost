# Shared settings for both processes (web + bot).
x-app: &app
  build: .
  image: tg-imagehost:latest
  env_file: .env
  volumes:
    - ./data:/app/data
  restart: unless-stopped
  networks:
    - tg_bot_image_net

services:
  web:
    <<: *app
    container_name: tg-imagehost-web
    command: python run_web.py
    # No host port mapping: the service is reachable inside the external
    # network as http://tg-imagehost-web:8080 (e.g. via cloudflared tunnel).
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  bot:
    <<: *app
    container_name: tg-imagehost-bot
    command: python run_bot.py
    depends_on:
      - web

networks:
  tg_bot_image_net:
    external: true
    name: cloudflared_default  # 直接映射到真实的外部网络
