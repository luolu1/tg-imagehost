<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TG 图床{% endblock %}</title>
  <style>
    :root {
      --bg: #0b0e14;
      --bg-2: #0f131b;
      --panel: #151a24;
      --panel-2: #1b212d;
      --panel-3: #222a38;
      --border: #2a3444;
      --border-soft: #1f2734;
      --text: #e8ecf3;
      --muted: #8f9bad;
      --faint: #5f6b7d;
      --accent: #4f8cff;
      --accent-2: #22d3a6;
      --accent-3: #a970ff;
      --warn: #ffb020;
      --danger: #ff5c6c;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(1200px 600px at 100% -10%, rgba(79,140,255,.10), transparent 60%),
        radial-gradient(900px 500px at -10% 10%, rgba(169,112,255,.10), transparent 55%),
        var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: none; }
    header.top {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 12px 24px; border-bottom: 1px solid var(--border-soft);
      background: rgba(15,19,27,.82); backdrop-filter: blur(12px);
      position: sticky; top: 0; z-index: 30;
    }
    header.top .brand {
      font-weight: 800; font-size: 18px; letter-spacing: .3px;
      background: linear-gradient(92deg, #7fb0ff, #a970ff 55%, #22d3a6);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      white-space: nowrap;
    }
    header.top nav { display: flex; gap: 6px; flex-wrap: wrap; }
    header.top nav a {
      padding: 7px 13px; border-radius: 999px; color: var(--muted);
      font-size: 14px; font-weight: 600; border: 1px solid transparent; transition: .15s;
    }
    header.top nav a:hover { color: var(--text); background: var(--panel-2); }
    header.top nav a.active { color: #fff; background: var(--accent); box-shadow: 0 4px 14px rgba(79,140,255,.35); }
    main { max-width: 1180px; margin: 0 auto; padding: 26px 22px 90px; }
    h1 { font-size: 24px; margin: 0 0 6px; letter-spacing: .2px; }
    h2 { font-size: 17px; margin: 0 0 14px; }
    .muted { color: var(--muted); }
    .faint { color: var(--faint); }
    .card {
      background: linear-gradient(180deg, var(--panel), var(--bg-2));
      border: 1px solid var(--border-soft); border-radius: var(--radius);
      padding: 22px; margin-bottom: 20px; box-shadow: var(--shadow);
    }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
    .grid { display: grid; gap: 16px; }
    .grid.cols-3 { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
    .grid.cols-2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
    .stat {
      position: relative; overflow: hidden;
      background: linear-gradient(180deg, var(--panel-2), var(--panel));
      border: 1px solid var(--border-soft); border-radius: 12px; padding: 16px;
    }
    .stat::after {
      content: ""; position: absolute; inset: 0 auto 0 0; width: 4px;
      background: var(--c, var(--accent));
    }
    .stat .num { font-size: 27px; font-weight: 800; line-height: 1.2; }
    .stat .lbl { color: var(--muted); font-size: 13px; }
    .stat .ic {
      position: absolute; top: 14px; right: 14px; font-size: 20px; opacity: .85;
    }
    button, .btn {
      background: linear-gradient(180deg, #5a95ff, var(--accent)); color: #fff;
      border: none; border-radius: 10px; padding: 10px 16px; font-size: 14px;
      cursor: pointer; font-weight: 600; display: inline-block; transition: .15s;
      box-shadow: 0 4px 14px rgba(79,140,255,.22);
    }
    button:hover, .btn:hover { filter: brightness(1.08); text-decoration: none; transform: translateY(-1px); }
    button:disabled, .btn:disabled {
      background: var(--panel-3); color: var(--faint); box-shadow: none;
      cursor: not-allowed; transform: none; filter: none;
    }
    button.danger, .btn.danger { background: linear-gradient(180deg, #ff7280, var(--danger)); box-shadow: 0 4px 14px rgba(255,92,108,.22); }
    button.ghost, .btn.ghost {
      background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
      box-shadow: none;
    }
    button.ghost:hover, .btn.ghost:hover { border-color: var(--accent); filter: none; }
    button.sm, .btn.sm { padding: 6px 11px; font-size: 13px; border-radius: 8px; }
    input[type=text], input[type=password], input[type=email], input[type=number], input[type=file], select, textarea {
      width: 100%; padding: 11px 13px; background: var(--panel-2);
      border: 1px solid var(--border); border-radius: 10px; color: var(--text);
      font-size: 14px; transition: .15s;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,140,255,.15); }
    input[type=file] { padding: 9px; }
    label { display: block; margin: 12px 0 6px; font-size: 14px; color: var(--muted); }
    .table-wrap { width: 100%; overflow-x: auto; border-radius: 10px; border: 1px solid var(--border-soft); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 11px 10px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
    thead th { color: var(--muted); font-weight: 600; background: var(--bg-2); white-space: nowrap; }
    tbody tr { transition: background .12s; }
    tbody tr:hover { background: rgba(79,140,255,.05); }
    tbody tr:last-child td { border-bottom: none; }
    .thumb { width: 52px; height: 52px; object-fit: cover; border-radius: 9px; background: var(--panel-2); border: 1px solid var(--border-soft); display: block; }
    .codebox {
      background: #090c11; border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px; word-break: break-all; color: #cdd6e4;
    }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .spread { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .toast { position: fixed; right: 20px; bottom: 20px; background: var(--panel-3);
      border: 1px solid var(--border); border-radius: 11px; padding: 12px 16px;
      opacity: 0; transform: translateY(10px); transition: all .25s; pointer-events: none;
      z-index: 60; box-shadow: var(--shadow); }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.err { border-color: var(--danger); }
    .badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 12px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
    .badge.ok { color: var(--accent-2); border-color: rgba(34,211,166,.4); background: rgba(34,211,166,.08); }
    .badge.bad { color: var(--danger); border-color: rgba(255,92,108,.4); background: rgba(255,92,108,.08); }
    .badge.info { color: var(--accent); border-color: rgba(79,140,255,.4); background: rgba(79,140,255,.08); }
    .badge.warn { color: var(--warn); border-color: rgba(255,176,32,.4); background: rgba(255,176,32,.08); }
    .badge.purple { color: var(--accent-3); border-color: rgba(169,112,255,.4); background: rgba(169,112,255,.08); }
    .pager { margin-top: 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .pager a { padding: 5px 11px; border: 1px solid var(--border); border-radius: 8px; }
    .pager a:hover { border-color: var(--accent); }
    .subnav { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 20px; }
    .subnav a {
      padding: 8px 16px; border: 1px solid var(--border-soft); border-radius: 999px;
      color: var(--muted); font-size: 14px; background: var(--panel); font-weight: 600;
    }
    .subnav a:hover { color: var(--text); border-color: var(--accent); }
    .subnav a.active { color: #fff; background: linear-gradient(180deg,#5a95ff,var(--accent)); border-color: transparent; box-shadow: 0 4px 14px rgba(79,140,255,.3); }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .actions form { margin: 0; }
    .actions button, .actions .btn { padding: 6px 11px; font-size: 13px; border-radius: 8px; }
    .banner { padding: 11px 15px; border-radius: 10px; margin-bottom: 16px; font-size: 14px; }
    .banner.ok { background: rgba(34,211,166,.1); border: 1px solid rgba(34,211,166,.4); color: var(--accent-2); }
    .banner.err { background: rgba(255,92,108,.1); border: 1px solid rgba(255,92,108,.4); color: var(--danger); }
    .banner.info { background: rgba(79,140,255,.1); border: 1px solid rgba(79,140,255,.4); color: #9ec2ff; }
    /* chart */
    .chart { display: flex; align-items: flex-end; gap: 6px; height: 170px; padding-top: 10px; }
    .chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; height: 100%; justify-content: flex-end; }
    .chart .bar {
      width: 100%; max-width: 34px; border-radius: 7px 7px 3px 3px;
      background: linear-gradient(180deg, #6ea4ff, var(--accent));
      min-height: 3px; transition: .18s; position: relative;
    }
    .chart .col:hover .bar { filter: brightness(1.15); }
    .chart .cap { font-size: 11px; color: var(--faint); white-space: nowrap; }
    .chart .cnt { font-size: 11px; color: var(--muted); font-weight: 700; }
    /* donut */
    .donut { width: 130px; height: 130px; border-radius: 50%; flex: none; position: relative; }
    .donut::after { content: ""; position: absolute; inset: 26px; border-radius: 50%; background: var(--bg-2); }
    .legend { display: flex; flex-direction: column; gap: 8px; }
    .legend .lt { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .legend .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
    /* progress */
    .progress { width: 100%; height: 9px; background: var(--panel-3); border-radius: 999px; overflow: hidden; }
    .progress > span { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent-2), var(--accent)); transition: width .4s; }
    .progress.hot > span { background: linear-gradient(90deg, var(--warn), var(--danger)); }
    /* checkboxes */
    input[type=checkbox].check {
      width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer; vertical-align: middle;
    }
    /* bulk bar */
    .bulkbar {
      position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px);
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      background: var(--panel-3); border: 1px solid var(--border); border-radius: 999px;
      padding: 10px 16px; box-shadow: var(--shadow); opacity: 0; pointer-events: none;
      transition: .2s; z-index: 40; max-width: calc(100% - 32px);
    }
    .bulkbar.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
    .bulkbar .count { font-weight: 700; color: var(--accent-2); }
    .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
    .toolbar .grow { flex: 1; min-width: 180px; }
    .quota-form { display: flex; gap: 6px; align-items: center; }
    .quota-form input { width: 84px; padding: 6px 9px; font-size: 13px; }
    .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
    .kv .k { color: var(--muted); }
    @media (max-width: 720px) {
      main { padding: 18px 14px 90px; }
      .hide-sm { display: none !important; }
      header.top { padding: 10px 14px; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">🖼️ TG 图床</div>
    {% set _p = request.url.path %}
    <nav>
      <a href="/upload" class="{% if _p == '/upload' %}active{% endif %}">上传</a>
      <a href="/my" class="{% if _p.startswith('/my') %}active{% endif %}">用户中心</a>
      <a href="/admin" class="{% if _p.startswith('/admin') %}active{% endif %}">管理后台</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <div id="toast" class="toast"></div>
  <script>
    function toast(msg, isErr) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show' + (isErr ? ' err' : '');
      clearTimeout(window.__tt);
      window.__tt = setTimeout(() => { t.className = 'toast'; }, 2600);
    }
    function copyText(text) {
      navigator.clipboard.writeText(text).then(
        () => toast('已复制'),
        () => toast('复制失败', true)
      );
    }
    // ---- bulk selection (checkboxes reference an external form via form="id") --
    function _bulkChecks(fid) {
      return Array.from(document.querySelectorAll('[data-row-check][form="' + fid + '"]'));
    }
    function syncBulk(fid) {
      const n = _bulkChecks(fid).filter(c => c.checked).length;
      document.querySelectorAll('[data-bulkbar][data-for="' + fid + '"]').forEach(bar => {
        bar.classList.toggle('show', n > 0);
        const c = bar.querySelector('[data-bulk-count]');
        if (c) c.textContent = n;
      });
    }
    document.addEventListener('change', (e) => {
      const t = e.target;
      if (t.matches('[data-select-all]')) {
        const fid = t.getAttribute('form');
        if (!fid) return;
        _bulkChecks(fid).forEach(cb => { cb.checked = t.checked; });
        syncBulk(fid);
      } else if (t.matches('[data-row-check]')) {
        const fid = t.getAttribute('form');
        if (!fid) return;
        const checks = _bulkChecks(fid);
        const all = document.querySelector('[data-select-all][form="' + fid + '"]');
        if (all) all.checked = checks.length > 0 && checks.every(c => c.checked);
        syncBulk(fid);
      }
    });
    document.addEventListener('click', (e) => {
      const b = e.target.closest('[data-copy]');
      if (b) { copyText(b.dataset.copy); }
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
