{% extends "base.html" %}
{% block title %}登录用户中心 · TG 图床{% endblock %}
{% block content %}
<div style="max-width:460px;margin:6vh auto 0">
  <div class="card">
    <h1>用户中心登录</h1>
    <p class="muted" style="margin-top:4px">
      在 Telegram 里给机器人发送 <code>/token</code> 获取你的 API Token，粘贴到下方登录。
    </p>
    {% if error %}<div class="banner err">{{ error }}</div>{% endif %}
    <form method="post" action="/my/login">
      <label>API Token</label>
      <input type="password" name="token" placeholder="粘贴你的 Token" autocomplete="off" autofocus required>
      <div class="row" style="margin-top:18px">
        <button type="submit" style="flex:1">登录</button>
      </div>
    </form>
    <p class="muted" style="margin-bottom:0;font-size:13px">
      没有 Token？把机器人拉进会话发送 <code>/token</code>，或前往
      <a href="/upload">上传页</a>。
    </p>
  </div>
</div>
{% endblock %}
