{% extends "base.html" %}
{% block title %}上传 · TG 图床{% endblock %}
{% block content %}
<div class="card">
  <h1>上传图片</h1>
  <p class="muted">在 Telegram 里发送 <code>/token</code> 获取 API Token，填入下方后即可上传。
    也可以直接前往 <a href="/my">用户中心</a> 用 Token 登录，管理你的图片与配额。</p>

  <label for="token">API Token</label>
  <div class="row">
    <input type="password" id="token" placeholder="粘贴你的 Token" style="flex:1">
    <button class="ghost" type="button" onclick="saveToken()">保存</button>
  </div>

  <label>选择文件（单文件上限 {{ max_mb }} MB）</label>
  <input type="file" id="file" accept="image/*">
  <div id="preview" style="margin-top:14px"></div>

  <div class="row" style="margin-top:16px">
    <button type="button" id="uploadBtn" onclick="doUpload()">⬆️ 上传</button>
    <span id="status" class="muted"></span>
  </div>
</div>

<div class="card">
  <div class="spread"><h2>本次结果</h2></div>
  <div id="results" class="muted">还没有上传记录。</div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const tokenInput = document.getElementById('token');
  tokenInput.value = localStorage.getItem('tg_token') || '';

  function saveToken() {
    localStorage.setItem('tg_token', tokenInput.value.trim());
    toast('Token 已保存到本地');
  }

  document.getElementById('file').addEventListener('change', (e) => {
    const f = e.target.files[0];
    const box = document.getElementById('preview');
    if (!f) { box.innerHTML = ''; return; }
    const url = URL.createObjectURL(f);
    box.innerHTML = `<img src="${url}" style="max-width:100%;max-height:320px;border-radius:10px;border:1px solid var(--border)">`;
  });

  async function doUpload() {
    const file = document.getElementById('file').files[0];
    const token = tokenInput.value.trim();
    const status = document.getElementById('status');
    if (!file) { toast('请选择文件', true); return; }
    if (!token) { toast('请填写 API Token', true); return; }

    const fd = new FormData();
    fd.append('file', file);
    status.textContent = '上传中…';
    document.getElementById('uploadBtn').disabled = true;

    try {
      const resp = await fetch('/api/upload', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token },
        body: fd,
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.detail || '上传失败');
      addResult(data);
      status.textContent = '完成 ✅';
      toast('上传成功');
    } catch (err) {
      status.textContent = '';
      toast(err.message, true);
    } finally {
      document.getElementById('uploadBtn').disabled = false;
    }
  }

  function addResult(d) {
    const box = document.getElementById('results');
    if (box.classList.contains('muted')) { box.classList.remove('muted'); box.innerHTML = ''; }
    const el = document.createElement('div');
    el.className = 'codebox';
    el.style.marginBottom = '10px';
    el.innerHTML = `
      <div style="display:flex;gap:12px;align-items:center">
        <img class="thumb" src="${d.url}">
        <div style="flex:1;min-width:0">
          <div class="row" style="gap:8px">
            <span class="codebox" style="flex:1">${d.url}</span>
            <button class="ghost" type="button" data-copy="${d.url}">复制</button>
          </div>
          <div class="muted" style="font-size:12px;margin-top:6px">${d.file_name || d.id} · ${formatSize(d.size)}</div>
        </div>
      </div>`;
    box.prepend(el);
    el.querySelector('[data-copy]').addEventListener('click', (e) => copyText(e.target.dataset.copy));
  }

  function formatSize(n) {
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
    return (n/1048576).toFixed(2) + ' MB';
  }
</script>
{% endblock %}
